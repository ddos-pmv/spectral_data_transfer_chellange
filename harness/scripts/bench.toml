# Конфиг прогона для bench.py. Копия этого файла кладётся рядом с результатами,
# так что по каталогу результатов всегда видно, чем именно они получены.
#
# Свип: любое значение-список в bench.fanout или producer.rate разворачивается
# в декартово произведение. Скаляр = одна точка.
#
# Ключ cpu необязателен везде: без него процесс не пиннится.

[bench]
repeats = 3     # повторов на точку; один p99.9 — это выборка, а не число
fanout = 1      # сколько [[receiver]] задействовать; [1, 2, 3] => свип
isolated = [2,4,6]   # ожидаемые isolcpus; сверяются с /sys, выставить их отсюда нельзя

[producer]
cpu = 8
rate = [250_000]  # msg/s, 0 = без троттлинга; [150_000, 300_000] => свип
type = "mixed"  # trade | bbo | book | mixed
slots = 1024    # степень двойки, общая для всех колец

[sender]
cpu = 4
batch = 1000

[consumer]
count = 1_000_000   # записанных замеров на получателя
warmup = 20_000   # съедается и выбрасывается до начала записи

[[receiver]]
cpu = 2
port = 9000
consumer_cpu = 6

[[receiver]]
cpu = 10
port = 9001
consumer_cpu = 12   # E-ядро

[[receiver]]
cpu = 13            # E-ядро
port = 9002
consumer_cpu = 14   # E-ядро

# Профилирование. enabled = false => bench.py ведёт себя ровно как раньше.
#
# Профайлеры навешиваются attach'ем (perf -p <pid>) на уже запущенный процесс, а
# не оборачивают его: обёртка ломается о то, что убийство perf не убивает
# потомка, а perf stat по SIGTERM не пишет ничего. Артефакты — в results/<ts>/prof/,
# сводка — там же в index.html.
#
# Считать латентность профилированных повторов наравне с чистыми нельзя: NMI от
# сэмплирования ложится ровно в хвост. Такие точки помечены колонкой profiled в
# summary.csv, а в scripts/latencies.csv для ноутбука отдаётся чистая точка.
# Исключение — stat: это счётчики без прерываний, они почти бесплатны.
#
# repeats — это НОМЕРА повторов (1..bench.repeats), а не их количество: на каких
# прогонах точки висят профайлеры по ролям. [1] = только первый повтор каждой
# точки, [1, 3] = первый и третий, [] = фильтра нет, то есть все. Настройки на
# отдельный инструмент нет: номер попал в список — вешаются все tools всех ролей.
# Чтобы в серии остался хотя бы один чистый повтор, bench.repeats должен быть
# больше, чем номеров в repeats + shared_repeats.
[profile]
enabled       = true
repeats       = [3]   # номера повторов для профайлеров по ролям; [] = все
collector_cpu = 0     # куда пинится сам сборщик — подальше от busy-spin ядер
freq          = 997   # -F для perf record; простое число, чтобы не попасть в такт нагрузке

# c2c и mem снимаются на точку целиком по объединению ядер, а не по одному pid:
# строку кэша делят producer с sender'ом и receiver с consumer'ом, с одной стороны
# HITM не виден. Но это системный сбор PEBS на тех же ядрах, и он вытесняет
# per-task события: замерено, что в общем повторе perf record падает с 3000 сэмплов
# до 6, а perf stat уезжает в multiplexing на 30%. Поэтому — отдельный повтор.
shared         = []   # c2c | mem
shared_repeats = [2]       # номера повторов для c2c/mem; [] = все, но обязательно
                           # не пересекаются с repeats выше

# По одному разделу на роль. Доступно: stat | record | cache-miss
[profile.producer]
tools = []                                  # чужой конец, оптимизировать его нельзя
[profile.sender]
tools = ["stat", "record", "cache-miss"]    # главный подозреваемый: упирается в sendmmsg
[profile.receiver]
tools = ["stat", "record"]
[profile.consumer]
tools = []
