# Конфиг прогона для bench.py. Копия этого файла кладётся рядом с результатами,
# так что по каталогу результатов всегда видно, чем именно они получены.
#
# Свип: любое значение-список в bench.fanout или producer.rate разворачивается
# в декартово произведение. Скаляр = одна точка.
#
# Ключ cpu необязателен везде: без него процесс не пиннится.

[bench]
repeats = 7     # повторов на точку; один p99.9 — это выборка, а не число
fanout = 1      # сколько [[receiver]] задействовать; [1, 2, 3] => свип
isolated = []   # ожидаемые isolcpus; сверяются с /sys, выставить их отсюда нельзя

[producer]
cpu = 2
rate = 150_000  # msg/s, 0 = без троттлинга; [150_000, 300_000] => свип
type = "mixed"  # trade | bbo | book | mixed
slots = 1024    # степень двойки, общая для всех колец

[sender]
cpu = 4
batch = 32

[consumer]
count = 2_000_000   # записанных замеров на получателя
warmup = 20_000   # съедается и выбрасывается до начала записи

# Секции ниже — пул доступных получателей, а не список запускаемых: сколько
# реально стартует, решает bench.fanout, и берутся первые по порядку. Их три,
# потому что README задачи говорит "1 to 3 receivers to start with" — то есть
# это потолок, до которого имеет смысл свипать fanout = [1, 2, 3] без правки
# конфига. Нужно больше — просто допишите секций.
#
# На каждого получателя приходится ДВА процесса, отсюда два ключа с ядрами:
#
#   sender ==UDP==> receiver -> /fanout_rx_N (shm) -> consumer
#                     cpu                             consumer_cpu
#
# receiver крутится на UDP-сокете и перекладывает датаграммы в shm-кольцо,
# consumer читает кольцо, ставит recv-таймстемп и пишет CSV. Оба busy-spin, так
# что ядра обязаны быть разными физическими: на одном получается 20 мс
# латентности и 72% потерь (проверено).
#
# Раскладка ниже под i7-12650H: P-ядра — чётные потоки 0-11, E-ядра — 12-15,
# cpu0 оставлен системе. При fanout = 3 часть процессов неизбежно уезжает на
# E-ядра (12/13/14), их латентность с P-ядрами не сравнима.
[[receiver]]
cpu = 6
port = 9000
consumer_cpu = 8

[[receiver]]
cpu = 10
port = 9001
consumer_cpu = 12   # E-ядро

[[receiver]]
cpu = 13            # E-ядро
port = 9002
consumer_cpu = 14   # E-ядро
